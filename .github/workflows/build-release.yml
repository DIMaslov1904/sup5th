name: Build release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v4.0.3
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'DIMaslov1904/sup5th'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.13.1'
          cache: npm
      - run: npm ci
      - run: npm run build:all
      - run: npm run lint:firefox
      - run: node scripts/prepare-release.mjs
      - name: Publish versioned packages
        run: gh release create "$RELEASE_TAG" "release/sup5th-chromium-${RELEASE_TAG}.zip" "release/sup5th-firefox-${RELEASE_TAG}.zip" "release/sup5th-safari-${RELEASE_TAG}.zip" --verify-tag --latest --title "SUP 5th ${RELEASE_TAG#v}" --notes-file release/NOTES.md
        env:
          GH_TOKEN: ${{ github.token }}
